; AEROCyd - build config for ESP32-2432S028R ("CYD", ILI9341 + XPT2046 resistive touch)
; TFT_eSPI is configured entirely through build flags, so no User_Setup.h editing is needed.
;
; If colours look inverted        -> set CYD_INVERT to 1 in src/main.cpp
; If red/blue are swapped          -> add  -DTFT_RGB_ORDER=TFT_BGR
; If you have the 2-USB-port CYD   -> replace ILI9341_2_DRIVER with ST7789_DRIVER and set CYD_INVERT 1

[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
build_flags =
    -Os
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DUSE_HSPI_PORT=1
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
